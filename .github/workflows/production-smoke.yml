name: production-smoke
# Проверяет опубликованный сайт после деплоя на GitHub Pages.
# Адрес можно переопределить переменной репозитория SITE_URL (например, для своего домена).
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://daridarom.github.io/shtab-tochka/' }}
    steps:
      - name: Probe site
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          get(){ curl -L -sS -o "$2" -w "%{http_code}" --max-time 30 "$1"; }
          code=$(get "$base" /tmp/body.html); echo "ROOT_HTTP=$code"; test "$code" = "200"
          grep -q "Центр управления" /tmp/body.html
          grep -q "app.js?v=17" /tmp/body.html
          grep -q "styles.css?v=12" /tmp/body.html
          code=$(get "${base}app.js" /tmp/app.js); echo "APP_JS_HTTP=$code"; test "$code" = "200"
          grep -q "projectTree" /tmp/app.js
          grep -q "startLive" /tmp/app.js
          code=$(get "${base}projects.js" /tmp/projects.js); echo "PROJECTS_JS_HTTP=$code"; test "$code" = "200"
          grep -q "Горизонт 45 / Азгард" /tmp/projects.js
          grep -q "Элиос" /tmp/projects.js
          code=$(get "${base}live.js" /tmp/live.js); echo "LIVE_JS_HTTP=$code"; test "$code" = "200"
          grep -q "raw.githubusercontent.com/Daridarom/shtab-tochka/telemetry/live/status.json" /tmp/live.js
          code=$(get "${base}orbit.js" /tmp/orbit.js); echo "ORBIT_JS_HTTP=$code"; test "$code" = "200"
          grep -q "orbitSVG" /tmp/orbit.js
          code=$(get "${base}manifest.webmanifest" /tmp/manifest.json); echo "MANIFEST_HTTP=$code"; test "$code" = "200"
          grep -q "Штаб.Точка" /tmp/manifest.json
          code=$(get "${base}icons/icon-192.png" /tmp/icon.png); echo "ICON_HTTP=$code"; test "$code" = "200"
          code=$(get "${base}max/" /tmp/max.html); echo "MAX_HTTP=$code"; test "$code" = "200"
          grep -q "Штаб.Точка MAX" /tmp/max.html
          asset=$(grep -o 'assets/index-[^"]*\.js' /tmp/max.html | head -1); test -n "$asset"
          code=$(get "${base}max/$asset" /tmp/max.js); echo "MAX_JS_HTTP=$code"; test "$code" = "200"
          grep -q "raw.githubusercontent.com" /tmp/max.js
          grep -q "Живая схема Штаба" /tmp/max.js
          grep -q "Окончание не указано" /tmp/max.js
          code=$(get "${base}model.js" /tmp/model.js); echo "MODEL_JS_HTTP=$code"; test "$code" = "200"
      - name: Probe telemetry source
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for b in telemetry main; do
            code=$(curl -L -sS -o /tmp/status.json -w "%{http_code}" --max-time 30 "https://raw.githubusercontent.com/Daridarom/shtab-tochka/$b/live/status.json?t=$(date +%s)") || code=000
            if [ "$code" = "200" ] && grep -q '"generated_at"' /tmp/status.json; then found="$b"; break; fi
          done
          test -n "$found"
          echo "TELEMETRY_SOURCE=$found"
          # Публичная телеметрия не должна нести приватные события, задачи и входящие
          if grep -Eq '"(events|tasks|inbox)"[[:space:]]*:' /tmp/status.json; then echo "::error::В публичной телеметрии появились приватные разделы"; exit 1; fi
          gen=$(grep -o '"generated_at": *"[^"]*"' /tmp/status.json | head -1 | sed 's/.*: *"//;s/"$//')
          age=$(( $(date +%s) - $(date -d "$gen" +%s) ))
          echo "TELEMETRY_AGE_SECONDS=$age"
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/status.json',encoding='utf-8'))
          public_text=json.dumps(data,ensure_ascii=False).lower()
          forbidden=('yandex','яндекс','private-gateway','private_url','cloud-tochka','yc_folder_id','yc_bucket','yc_allowed_user_ids')
          leaks=[x for x in forbidden if x in public_text]
          assert not leaks, f'private infrastructure leaked into public telemetry: {leaks}'
          ts=data.get('task_summary')
          if ts is not None:
              assert ts.get('schema')=='tasks-public-1'
              for item in ts.get('items') or []:
                  assert set(item) <= {'id','project','title','status','deadline','fresh','verified_at'}, set(item)
                  assert not any(k in item for k in ('source_url','url','links','owner_email','description'))
          ins=data.get('inbox_summary')
          if ins is not None:
              assert ins.get('schema')=='inbox-summary-1'
              for ch in (ins.get('channels') or {}).values():
                  assert set(ch) <= {'read_ok','total','last_24h','last_message_at','attention_count'}, set(ch)
                  assert not any(k in ch for k in ('messages','source_states','chat_id','user_id','text'))
          print('SAFE_TASK_INBOX_PROJECTION=OK')
          PY

      - name: Probe safe calendar projection
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for b in telemetry main; do
            code=$(curl -L -sS -o /tmp/calendar.json -w "%{http_code}" --max-time 30 "https://raw.githubusercontent.com/Daridarom/shtab-tochka/$b/live/calendar.json?t=$(date +%s)") || code=000
            if [ "$code" = "200" ] && grep -q '"schema": *"calendar-1"' /tmp/calendar.json; then found="$b"; break; fi
          done
          test -n "$found"
          echo "CALENDAR_SOURCE=$found"
          python3 - <<'PY'
          import json
          p='/tmp/calendar.json'
          data=json.load(open(p,encoding='utf-8'))
          public_text=json.dumps(data,ensure_ascii=False).lower()
          forbidden=('yandex','яндекс','private-gateway','private_url','cloud-tochka','yc_folder_id','yc_bucket','yc_allowed_user_ids')
          leaks=[x for x in forbidden if x in public_text]
          assert not leaks, f'private infrastructure leaked into public calendar projection: {leaks}'
          assert data.get('schema')=='calendar-1'
          assert data.get('generated_at')
          assert isinstance(data.get('events'),list)
          allowed_top={'schema','generated_at','ttl_seconds','events','visibility','detail_available','source_status'}
          assert set(data)<=allowed_top, set(data)-allowed_top
          assert data.get('visibility')=='private'
          assert data.get('detail_available') is False
          assert data.get('source_status') in {'available','empty','unavailable'}
          allowed_event={'id','title','kind','start','end','endConfirmed','allDay','format','location','project'}
          forbidden={'description','attendees','joinUrl','url','web_link','hangout_link','organizer','email'}
          for e in data['events']:
              assert isinstance(e,dict)
              assert e.get('id') and e.get('start')
              assert not (set(e)&forbidden), set(e)&forbidden
              assert set(e)<=allowed_event, set(e)-allowed_event
          print('CALENDAR_EVENTS=',len(data['events']))
          PY
