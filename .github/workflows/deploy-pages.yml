name: Deploy to GitHub Pages
# Публикует папку public/ (панель ЦУП + собранное MAX-приложение) на GitHub Pages.
# Телеметрические коммиты live/status.json деплой не запускают.
# Источник Pages: только «GitHub Actions» (Settings → Pages). Сборка «из ветки» выкладывает несобранные исходники поверх сайта.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'live/status.json'
      - 'README.md'
      - 'docs/**'
      - 'bot/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: max/package-lock.json
      - name: Check live state semantics
        run: |
          node tests/live-state.test.mjs
          node tests/model.test.mjs
      - name: Install MAX UI dependencies
        working-directory: max
        run: npm ci --no-audit --no-fund
      - name: Build MAX UI into public/max
        working-directory: max
        run: npm run build
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          cp -R public/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/live.js
          test -f _site/max/index.html
          test -f _site/model.js
          ls _site/max/assets
      - name: Switch Pages source to GitHub Actions
        # Если сайт Pages настроен «из ветки», пробуем переключить его на деплой из Actions.
        # Если прав не хватает, шаг не валит сборку: источник переключается вручную в Settings → Pages.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
            || echo "::warning::Не удалось переключить источник Pages автоматически. Переключи вручную в Settings, раздел Pages, Source = GitHub Actions"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
